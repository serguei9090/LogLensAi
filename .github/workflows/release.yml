name: Build & Release Artifacts (Windows & Web)

on:
  push:
    branches: [main, feat/*]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web Production SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Web SPA
        run: bun run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loglensai-web-dist
          path: dist/
          retention-days: 14

  build-windows:
    name: Build Windows Desktop & Sidecar
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Go Sidecar Binary
        working-directory: backend-go
        run: go build -v -o sidecar.exe ./cmd/sidecar

      - name: Build Tauri Desktop (NSIS & MSI)
        run: bun run tauri build

      - name: Upload Windows Executable & Installers
        uses: actions/upload-artifact@v4
        with:
          name: loglensai-windows-artifacts
          path: |
            backend-go/sidecar.exe
            src-tauri/target/release/app.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend-go/sidecar.exe
            src-tauri/target/release/app.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
