name: CI & Quality Verification

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-and-unit-tests:
    name: Lint, Typecheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint with Biome
        run: bun run lint

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Run Vitest Unit & Contract Tests
        run: bun run test

  backend-go-tests:
    name: Backend Go Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run go vet
        working-directory: backend-go
        run: go vet ./...

      - name: Run backend tests
        working-directory: backend-go
        run: go test -v ./internal/query/... ./internal/drain3/... ./internal/models/...
